<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트폰 사용 시간 대시보드</title>
    <!-- Fonts -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js and PapaParse -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>디지털 웰빙 조회</h1>
            <div class="search-box">
                <input type="number" id="classInput" placeholder="반 (예: 4)" />
                <input type="number" id="numberInput" placeholder="번호 (예: 20)" />
                <button id="searchBtn">조회</button>
            </div>
            <p id="errorMsg" class="error-msg"></p>
        </header>

        <main id="dashboard" class="dashboard hidden">
            <div class="card date-range-card">
                <h2 class="date-range">5월 24일-5월 30일 (22주차)</h2>
                <div class="tabs">
                    <span class="tab">19주</span>
                    <span class="tab">20주</span>
                    <span class="tab">21주</span>
                    <span class="tab active">22주</span>
                </div>
            </div>

            <div class="card chart-card">
                <div class="chart-header">
                    <p class="subtitle">주별 총 사용 시간</p>
                    <h2 class="main-title" id="weeklyTotalTitle">0시간 0분</h2>
                    <div style="margin-top: 12px;"></div>
                    <p class="subtitle">하루 평균 사용시간</p>
                    <h2 class="main-title" id="dailyAverageTitle">0시간 0분</h2>
                </div>
                
                <div class="chart-container">
                    <canvas id="usageChart"></canvas>
                </div>
                
                <div class="legend">
                    <div class="legend-item">
                        <span class="dot orange"></span> 하루 기기 사용 시간
                    </div>
                    <div class="legend-item">
                        <span class="line-icon"></span> 전체 평균
                    </div>
                </div>
            </div>

            <div class="card info-card">
                <div class="info-header">
                    <h3>사용 시간 균형</h3>
                </div>
                <div class="info-body">
                    <p id="comparisonText">하루 평균, 전체 유저에 비해 0시간 0분 많이 사용했습니다.</p>
                </div>
            </div>
            
            <div class="card info-card">
                <div class="info-header">
                    <h3>나만의 목표 달성</h3>
                </div>
                <div class="info-body">
                    <div style="margin-bottom: 16px; background: #f2f2f7; padding: 12px; border-radius: 12px;">
                        <p class="subtitle" style="margin-bottom: 8px;">스마트폰 하루 목표 시간 설정</p>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <input type="number" id="goalHours" min="0" max="24" value="2" style="width: 60px; padding: 8px; border: 1px solid var(--border-color); border-radius: 8px; text-align: right; outline: none;"> 시간
                            <input type="number" id="goalMinutes" min="0" max="59" value="0" style="width: 60px; padding: 8px; border: 1px solid var(--border-color); border-radius: 8px; text-align: right; outline: none;"> 분
                            <button id="setGoalBtn" style="padding: 8px 16px; background-color: var(--accent-green); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-left: auto;">적용</button>
                        </div>
                    </div>
                    <p id="goalText" style="font-size: 15px; font-weight: 500; margin-bottom: 8px;">하루 목표: 2시간 0분</p>
                    <div class="progress-bar-bg" style="height: 8px; margin-bottom: 8px;">
                        <div class="progress-bar-fill" id="goalProgress" style="background-color: var(--accent-blue);"></div>
                    </div>
                    <p id="goalResultText" class="text-sm text-gray">지난주 평균에 비해 설정한 목표를 달성하려면 X시간 Y분 줄여야 합니다.</p>
                </div>
            </div>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
