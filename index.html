<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트폰 사용 시간 대시보드</title>
    <!-- 스마트폰 앱 설치(PWA) 및 홈 화면 아이콘 설정 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f2f2f7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="웰빙조회">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" href="icon.png" type="image/png">
    <!-- Fonts -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js and PapaParse -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>디지털 웰빙 조회</h1>
            <div class="search-box">
                <input type="number" id="classInput" placeholder="반 (예: 4)" />
                <input type="number" id="numberInput" placeholder="번호 (예: 20)" />
                <button id="searchBtn">조회</button>
            </div>
            <p id="errorMsg" class="error-msg"></p>
        </header>

        <main id="dashboard" class="dashboard hidden">
            <div class="card date-range-card">
                <h2 class="date-range">5월 24일-5월 30일 (22주차)</h2>
                <div class="tabs">
                    <span class="tab">19주</span>
                    <span class="tab">20주</span>
                    <span class="tab">21주</span>
                    <span class="tab active">22주</span>
                </div>
            </div>

            <div class="card chart-card">
                <div class="chart-header">
                    <p class="subtitle">주별 총 사용 시간</p>
                    <h2 class="main-title" id="weeklyTotalTitle">0시간 0분</h2>
                    <div style="margin-top: 12px;"></div>
                    <p class="subtitle">하루 평균 사용시간</p>
                    <h2 class="main-title" id="dailyAverageTitle">0시간 0분</h2>
                    <div style="margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 16px;"></div>
                    <p class="subtitle" style="font-weight: 600; color: var(--text-primary);">전체 평균과 비교</p>
                </div>
                
                <div class="chart-container">
                    <canvas id="usageChartOverall"></canvas>
                </div>
                
                <div class="legend">
                    <div class="legend-item">
                        <span class="dot orange"></span> 나의 사용 시간
                    </div>
                    <div class="legend-item">
                        <span class="line-icon"></span> 전체 평균
                    </div>
                </div>
            </div>

            <div class="card chart-card">
                <div class="chart-header">
                    <p class="subtitle" style="font-weight: 600; color: var(--text-primary);">우리 반 평균과 비교</p>
                </div>
                
                <div class="chart-container">
                    <canvas id="usageChartClass"></canvas>
                </div>
                
                <div class="legend">
                    <div class="legend-item">
                        <span class="dot orange"></span> 나의 사용 시간
                    </div>
                    <div class="legend-item">
                        <span class="line-icon"></span> 반 평균
                    </div>
                </div>
            </div>

            <div class="card info-card">
                <div class="info-header">
                    <h3>사용 시간 균형</h3>
                </div>
                <div class="info-body" style="display: flex; flex-direction: column; gap: 8px;">
                    <p id="comparisonOverallText">● 전체 평균 계산 중...</p>
                    <p id="comparisonClassText">● 반 평균 계산 중...</p>
                </div>
            </div>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
